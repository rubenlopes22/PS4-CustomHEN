
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS4 CustomHEN 0.8</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #123d70, #050914 65%);
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 520px;
    background: rgba(10, 20, 38, .94);
    border: 1px solid #1678d4;
    border-radius: 18px;
    padding: 28px;
    text-align: center;
    box-shadow: 0 0 35px #087bdb40;
}

.logo {
    font-size: 34px;
    font-weight: bold;
    color: #36a6ff;
    margin-bottom: 8px;
}

.version {
    color: #9bbbd9;
    margin-bottom: 25px;
}

.status {
    background: #101e32;
    border-radius: 10px;
    padding: 15px;
    margin: 18px 0;
    text-align: left;
    line-height: 1.8;
}

.status span {
    color: #39aaff;
}

button {
    width: 100%;
    border: none;
    padding: 17px;
    border-radius: 10px;
    background: linear-gradient(90deg, #0879df, #20aaff);
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 12px;
}

button:hover {
    filter: brightness(1.15);
}

.secondary {
    background: #182b43;
}

#log {
    background: #050b14;
    color: #9fcfff;
    padding: 13px;
    margin-top: 18px;
    border-radius: 9px;
    min-height: 65px;
    font-size: 13px;
    text-align: left;
    overflow-wrap: anywhere;
}

footer {
    color: #718ba7;
    font-size: 12px;
    margin-top: 22px;
}
</style>
</head>

<body>
<div class="container">

    <div class="logo">PS4 CustomHEN</div>
    <div class="version">VERSÃO 0.8 — AUTO GOLDHEN</div>

    <h2>Centro de desbloqueio</h2>

    <div class="status">
        Firmware: <span id="firmware">Não verificado</span><br>
        Navegador: <span id="browser">A verificar</span><br>
        Ligação: <span id="network">A verificar</span><br>
        Slopkit: <span id="slopkit">Não verificado</span><br>
        Relapse: <span id="relapse">Não verificado</span>
    </div>

    <button onclick="diagnostico()">
        VERIFICAR SISTEMA
    </button>

    <button onclick="preparar()" class="secondary">
        PREPARAR CUSTOMHEN 0.8
    </button>

    <div id="log">
        CustomHEN 0.8 iniciado.
    </div>

    <footer>
        PS4 CustomHEN 0.8<br>
        Interface experimental — não confirma nem executa um desbloqueio.
    </footer>

</div>

<script>
const log = document.getElementById("log");

function mensagem(texto) {
    log.innerHTML += "<br>" + texto;
}

async function verificarPasta(caminho) {
    try {
        const resposta = await fetch(caminho, {
            method: "HEAD",
            cache: "no-store"
        });
        return resposta.ok;
    } catch {
        return false;
    }
}

async function diagnostico() {
    log.innerHTML = "A verificar sistema...";

    document.getElementById("browser").textContent =
        navigator.userAgent.includes("PlayStation 4")
        ? "PS4"
        : "Outro navegador";

    document.getElementById("network").textContent =
        navigator.onLine ? "Ligado" : "Sem ligação";

    document.getElementById("firmware").textContent =
        "Não disponível através do navegador";

    const s = await verificarPasta("./slopkit/latest/index");
    const r = await verificarPasta("./relapse/goldhen/jb");

    document.getElementById("slopkit").textContent =
        s ? "Ficheiro encontrado" : "Não encontrado";

    document.getElementById("relapse").textContent =
        r ? "Ficheiro encontrado" : "Não encontrado";

    mensagem("Diagnóstico concluído.");
}

function preparar() {
    log.innerHTML = "A preparar CustomHEN 0.8...";
    mensagem("Interface carregada.");
    mensagem("A verificar componentes...");
    mensagem("Nenhum exploit foi executado.");
    mensagem("É necessária uma cadeia de exploit compatível e validada.");
}

diagnostico();
</script>
</body>
</html>
