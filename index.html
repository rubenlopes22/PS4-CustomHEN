
<div class="goldhen-panel">
  <h2>GOLDHEN</h2>
  <p>PS4 Firmware 13.52</p>

  <button id="startGoldHEN">
    ⚡ INICIAR GOLDHEN
  </button>

  <p id="goldhenStatus">Estado: pronto</p>
</div>

<style>
.goldhen-panel {
  background: #111d32;
  border: 1px solid #168cff;
  border-radius: 15px;
  padding: 22px;
  text-align: center;
  color: white;
  max-width: 450px;
  margin: 20px auto;
}

#startGoldHEN {
  background: #087bea;
  color: white;
  border: 0;
  border-radius: 10px;
  padding: 16px;
  width: 100%;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

#goldhenStatus {
  color: #69bdff;
  margin-top: 15px;
}
</style>

<script>
document.getElementById("startGoldHEN")
.addEventListener("click", function () {

  const status = document.getElementById("goldhenStatus");

  status.textContent = "A abrir o Relapse...";

  window.location.href =
    "./relapse/version-selector.html";

});
</script>
